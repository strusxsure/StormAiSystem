<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StormAI - AI Website Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#f59e0b", // Orange from screenshot
              "primary-hover": "#d97706",
              "background-light": "#ffffff",
              "background-dark": "#0f172a", // Slate 900
              "surface-light": "#f8fafc", // Slate 50
              "surface-dark": "#1e293b", // Slate 800
              "text-light": "#0f172a", // Slate 900
              "text-dark": "#f8fafc", // Slate 50
              "subtext-light": "#475569", // Slate 600
              "subtext-dark": "#94a3b8", // Slate 400
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
              sans: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              xl: "1rem",
              "2xl": "1.5rem",
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'glow': '0 0 15px rgba(245, 158, 11, 0.3)',
            },
            animation: {
              'fade-in-up': 'fade-in-up 0.8s ease-out forwards',
                    'fade-in': 'fade-in 0.5s ease-out forwards',
                    'wave': 'wave 1.2s ease-in-out infinite',
                  },
                  keyframes: {
                    'fade-in-up': {
                      '0%': { opacity: '0', transform: 'translateY(20px)' },
                      '100%': { opacity: '1', transform: 'translateY(0)' },
                    },
                    'fade-in': {
                      '0%': { opacity: '0' },
                      '100%': { opacity: '1' },
                    },
                    wave: {
                      '0%, 100%': { transform: 'scaleY(0.5)', opacity: '0.5' },
                      '50%': { transform: 'scaleY(1.5)', opacity: '1' },
                    }
                  }
              },
          },
      };
    </script>
    <style>
        /* Custom Scrollbar for the whole app */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .hero-gradient {
            background: linear-gradient(90deg, #FDE68A, #F59E0B, #FFFBEB, #F59E0B);
            background-size: 300% 300%;
            animation: flow 8s ease infinite;
        }
        .dark .hero-gradient {
            background: linear-gradient(90deg, #78350F, #B45309, #451A03, #B45309);
            background-size: 300% 300%;
            animation: flow 8s ease infinite;
        }

        .btn-shine {
          position: relative;
          overflow: hidden;
          z-index: 1;
        }

        .btn-shine::after {
          content: '';
          position: absolute;
          top: -50%;
          left: -210%;
          width: 200%;
          height: 200%;
          opacity: 0;
          transform: rotate(30deg);
          background: rgba(255, 255, 255, 0.13);
          background: linear-gradient(
            to right,
            rgba(255, 255, 255, 0.13) 0%,
            rgba(255, 255, 255, 0.13) 77%,
            rgba(255, 255, 255, 0.5) 92%,
            rgba(255, 255, 255, 0.0) 100%
          );
        }

        .btn-shine:active::after {
            opacity: 1;
            left: 110%;
            transition: all 0.7s cubic-bezier(0.32, 0, 0.67, 0);
        }
    </style>
</head>
  <body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 font-sans antialiased selection:bg-primary selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
